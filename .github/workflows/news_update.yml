name: News Update Pipeline

on:
  schedule:
    # 6 AM KST is 9 PM UTC of the previous day
    - cron: '0 21 * * *' # 9 PM UTC is 6 AM KST
  workflow_dispatch: # Allow manual trigger

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        
    - name: Run pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python pipeline/main.py
        
    - name: Deploy static JSON to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public_data
        publish_branch: gh-pages
        keep_files: false
        commit_message: "chore: auto-update latest news [skip ci]"
