name: News Update Pipeline

on:
  # Triggered on time by GCP Cloud Scheduler (headline-briefing-news-update, asia-northeast3)
  # at 06:00 & 18:00 KST via the workflow_dispatch REST API.
  # GitHub's native `schedule` trigger was removed because it ran 3-5 hours late.
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        
    - name: Run pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        python -u pipeline/main.py
        
    - name: Deploy static JSON to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public_data
        publish_branch: gh-pages
        keep_files: true
        commit_message: "chore: auto-update latest news & market briefing [skip ci]"
