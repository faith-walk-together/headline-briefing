name: News Update Pipeline

on:
  schedule:
    # Run twice a day at 12-hour intervals (10 min early to avoid GitHub Actions :00 queue delay):
    # 18:50 KST (09:50 UTC same day) & 06:50 KST (21:50 UTC previous day)
    - cron: '50 9 * * *'
    - cron: '50 21 * * *'
  push:
    branches:
      - main
    paths:
      - 'pipeline/watchlist.json'
      - 'pipeline/main.py'
      - '.github/workflows/news_update.yml'
  workflow_dispatch: # Allow manual trigger

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        
    - name: Run pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        python -u pipeline/main.py
        
    - name: Deploy static JSON to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public_data
        publish_branch: gh-pages
        keep_files: true
        commit_message: "chore: auto-update latest news & market briefing [skip ci]"
